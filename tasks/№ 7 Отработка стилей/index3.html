<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border: 1px solid;
            border-collapse: collapse;
        }

        tr td {
            border: 1px solid;
            padding: 10px 15px;
        }

        tr th {
            background-color: black;
            color: white;
        }

        tbody tr:nth-child(even) {
            background-color: lightgray;
        }

        tr:hover {
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th>Имя</th>
                <th>Очки</th>
                <th>Ранг</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Саня</td>
                <td>214</td>
                <td>Капрал</td>
            </tr>
            <tr>
                <td>Ваня</td>
                <td>214</td>
                <td>Капрал</td>
            </tr>
            <tr>
                <td>Даня</td>
                <td>215</td>
                <td>Капрал</td>
            </tr>
            <tr>
                <td>Василий</td>
                <td>216</td>
                <td>Капрал</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
