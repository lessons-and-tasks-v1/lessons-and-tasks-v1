<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::first-letter {
            font-size: 52px;
            color: brown;
        }
        h1::before {
            content:✦ ;
        }
        p::after {
            content:— Конец главы —;
        }
        p::first-line {
            color: darkblue;
        }
    </style>
</head>
<body>
    <h1>Летопись средиземья</h1>
    <p>Хочу напомнить тебе, что в древних летописях говорится о подобном происшествии</p>
</body>
</html>
