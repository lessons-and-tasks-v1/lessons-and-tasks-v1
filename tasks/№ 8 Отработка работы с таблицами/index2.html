<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        th, td {
            padding: 12px 20px;
            border: 1px solid black;
            text-align: center;
        }

        tr th {
            padding: 12px;
        }

        table {
            border: 1px solid black;
            border-collapse: collapse;
        }
        .obed {
            background-color: rgba(7, 158, 7, 0.308);
        }
        .lab {
            background-color: rgba(9, 156, 137, 0.603);
        }
        .project  {
             background-color: #cc872188;
            }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th scope="col">Время</th>
                <th scope="col">Понедельник</th>
                <th scope="col">Вторник</th>
                <th scope="col">Среда</th>
                <th scope="col">Четверг</th>
                <th scope="col">Пятница</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>09:00–10:00</td>
                <td class="lab" rowspan="2">Лабороторная работа</td>
                <td>CSS</td>
                <td>HTML</td>
                <td>JavaScript</td>
                <td>Python</td>
            </tr>
            <tr>
                <td>10:00–11:00</td>
                <td>CSS</td>
                <td>Python</td>
                <td>CSS</td>
                <td>C#</td>
            </tr>
            <tr>
                <td>11:00–12:00</td>
                <td class="obed" colspan="6">Обеденный перерыв</td>
            </tr>
            <tr>
                <td>12:00–13:00</td>
                <td>Python</td>
                <td>Javascript</td>
                <td class="project" colspan="2">Командный проект</td>
                <td>HTML</td>
            </tr>
            <tr>
                <td>13:00–14:00</td>
                <td>CSS</td>
                <td>Javascript</td>
                <td>C#</td>
                <td>HTML</td>
                <td>HTML</td>
            </tr>
        </tbody>
    </table>
</body>

</html>





<!--Чтобы одна ячейка занимала несколко строк или столбцов,мы используем "colspan" или "rowspan"
"rowspan"-по вертикали "colspan" -по горизонтали-->
