<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border: 1px solid black;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            border-collapse:collapse ;
            
        }

        caption {
            font-size: 20px;
        }
        th,td {
            border: 1px solid black;
            padding: 6px 12px;
        }
    </style>
</head>

<body>
    <table>
        <caption>Бюджет экспедиции на Марс</caption>
        <thead>
            <tr>
                <th scope="col">Оборудование</th>
                <th scope="col">Количество</th>
                <th scope="col">Цена за единицу,₽</th>
                <th scope="col">Общая стоимость,₽</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="col">Скафандр</th>
                <td>4</td>
                <td>150,000</td>
                <td>600,000</td>
            </tr>
            <tr>
                <th scope="col">Кислородный балон</th>
                <td>8</td>
                <td>25,000</td>
                <td>200,000</td>
            </tr>
            <tr>
                <th scope="col">Навигационный модуль</th>
                <td>2</td>
                <td>320,000</td>
                <td>640,000</td>
            </tr>
            <tr>
                <th scope="col">Солнечная панель</th>
                <td>6</td>
                <td>45,000</td>
                <td>270,000</td>
            </tr>
            <tr>
                <th scope="col">Радиостанция</th>
                <td>3</td>
                <td>80,000</td>
                <td>240,000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th>Итого</th>
                <td colspan="3">1,410,000</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
